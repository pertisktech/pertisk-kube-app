name: Build macOS DMG

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build ${{ matrix.arch }} DMG
    # macos-13 Intel runners are deprecated and often never get assigned.
    # Both arches build on Apple Silicon; Intel is cross-compiled.
    runs-on: macos-14
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-apple-darwin
            macho_arch: x86_64
          - arch: aarch64
            rust_target: aarch64-apple-darwin
            macho_arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install protobuf compiler
        run: brew install protobuf

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            frontend/src-tauri -> frontend/src-tauri/target
          key: ${{ matrix.arch }}

      - name: Resolve app version from tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(git describe --tags --always --abbrev=7 2>/dev/null || echo "1.0.0-dev")"
          fi

          VERSION="${VERSION#v}"

          # Keep display/app version as-is, but force a strict semver for tauri config.
          TAURI_VERSION="$(echo "${VERSION}" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [[ -z "${TAURI_VERSION}" ]]; then
            TAURI_VERSION="0.1.0"
          fi

          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAURI_VERSION=${TAURI_VERSION}" >> "$GITHUB_ENV"
          echo "Resolved app version: ${VERSION}"
          echo "Resolved tauri version: ${TAURI_VERSION}"
          echo "Build target: ${{ matrix.arch }} (${{ matrix.rust_target }})"

      - name: Detect macOS signing configuration
        shell: bash
        run: |
          missing=0
          for var in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!var}" ]]; then
              echo "Missing Apple secret: ${var}" >&2
              missing=1
            fi
          done

          if [[ "${missing}" -eq 0 ]]; then
            echo "HAS_APPLE_SIGNING=true" >> "$GITHUB_ENV"
            echo "Apple signing/notarization secrets detected."
          else
            echo "HAS_APPLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "Apple signing/notarization secrets are incomplete; building unsigned DMG."
          fi
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build bundled backend binary
        run: cargo build --release -p pertisk-kube-backend --target ${{ matrix.rust_target }}

      - name: Build ktail binary for bundling
        shell: bash
        run: |
          KTAIL_DIR="/tmp/pertisk-ktail"
          rm -rf "${KTAIL_DIR}"
          git clone --depth 1 https://github.com/pertisktech/pertisk-ktail.git "${KTAIL_DIR}"
          cargo build --release --manifest-path "${KTAIL_DIR}/Cargo.toml" --target ${{ matrix.rust_target }}

          KTAIL_BIN=""
          for candidate in \
            "${KTAIL_DIR}/target/${{ matrix.rust_target }}/release/ktail" \
            "${KTAIL_DIR}/target/${{ matrix.rust_target }}/release/pertisk-ktail"
          do
            if [[ -x "${candidate}" ]]; then
              KTAIL_BIN="${candidate}"
              break
            fi
          done

          if [[ -z "${KTAIL_BIN}" ]]; then
            echo "ktail binary was not produced" >&2
            exit 1
          fi

          echo "KTAIL_BINARY_PATH=${KTAIL_BIN}" >> "$GITHUB_ENV"
          echo "Using ktail binary: ${KTAIL_BIN}"

      - name: Stage sidecar binaries for Tauri bundle
        shell: bash
        run: |
          BACKEND_BIN="target/${{ matrix.rust_target }}/release/pertisk-kube-backend"
          if [[ ! -x "${BACKEND_BIN}" ]]; then
            echo "Backend binary missing after cargo build: ${BACKEND_BIN}" >&2
            exit 1
          fi

          # build.rs expects workspace target/release/pertisk-kube-backend.
          mkdir -p target/release
          cp -f "${BACKEND_BIN}" target/release/pertisk-kube-backend
          chmod +x target/release/pertisk-kube-backend

          mkdir -p frontend/src-tauri/bundle-resources
          cp -f "${BACKEND_BIN}" frontend/src-tauri/bundle-resources/pertisk-kube-backend
          chmod +x frontend/src-tauri/bundle-resources/pertisk-kube-backend
          cp -f "${KTAIL_BINARY_PATH}" frontend/src-tauri/bundle-resources/ktail
          chmod +x frontend/src-tauri/bundle-resources/ktail

          echo "Staged sidecars:"
          ls -lh frontend/src-tauri/bundle-resources/
          file frontend/src-tauri/bundle-resources/pertisk-kube-backend
          file frontend/src-tauri/bundle-resources/ktail

      - name: Build signed and notarized macOS DMG
        if: env.HAS_APPLE_SIGNING == 'true'
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          KTAIL_BINARY_PATH: ${{ env.KTAIL_BINARY_PATH }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run tauri:build -- --target ${{ matrix.rust_target }} --bundles dmg --config '{"version":"${{ env.TAURI_VERSION }}"}'

      - name: Build unsigned macOS DMG
        if: env.HAS_APPLE_SIGNING != 'true'
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          KTAIL_BINARY_PATH: ${{ env.KTAIL_BINARY_PATH }}
        run: |
          npm run tauri:build -- --target ${{ matrix.rust_target }} --bundles dmg --config '{"version":"${{ env.TAURI_VERSION }}"}'

      - name: Locate and rename DMG
        id: dmg
        shell: bash
        run: |
          shopt -s nullglob
          CANDIDATES=(
            frontend/src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
          )
          DMG_PATH=""
          for path in "${CANDIDATES[@]}"; do
            if [[ -f "${path}" ]]; then
              DMG_PATH="${path}"
              break
            fi
          done
          if [[ -z "${DMG_PATH}" ]]; then
            echo "No DMG produced" >&2
            find frontend/src-tauri/target -name '*.dmg' 2>/dev/null || true
            exit 1
          fi

          DEST_DIR="$(dirname "${DMG_PATH}")"
          DEST_NAME="PTKublet_${APP_VERSION}_${{ matrix.arch }}.dmg"
          DEST_PATH="${DEST_DIR}/${DEST_NAME}"
          if [[ "${DMG_PATH}" != "${DEST_PATH}" ]]; then
            mv -f "${DMG_PATH}" "${DEST_PATH}"
          fi

          mkdir -p dist
          cp -f "${DEST_PATH}" "dist/${DEST_NAME}"

          echo "DMG_PATH=${PWD}/dist/${DEST_NAME}" >> "$GITHUB_ENV"
          echo "dmg_path=${PWD}/dist/${DEST_NAME}" >> "$GITHUB_OUTPUT"
          echo "Renamed DMG: ${DEST_PATH}"
          ls -lh "${DEST_PATH}" "dist/${DEST_NAME}"

      - name: Verify DMG and sidecar architectures
        shell: bash
        run: |
          expected="${{ matrix.macho_arch }}"

          check_arch() {
            local bin="$1"
            local label="$2"
            if [[ ! -f "${bin}" ]]; then
              echo "Missing ${label}: ${bin}" >&2
              exit 1
            fi
            local info
            info="$(file "${bin}")"
            echo "${label}: ${info}"
            if ! echo "${info}" | grep -Eq "${expected}"; then
              echo "${label} architecture mismatch; expected ${expected}" >&2
              lipo -info "${bin}" || true
              exit 1
            fi
          }

          # Staged sidecars survive after Tauri cleans the .app post-DMG bundling.
          check_arch "frontend/src-tauri/bundle-resources/pertisk-kube-backend" "staged backend sidecar"
          if [[ -f frontend/src-tauri/bundle-resources/ktail ]]; then
            check_arch "frontend/src-tauri/bundle-resources/ktail" "staged ktail sidecar"
          fi

          # Tauri removes PTKublet.app after creating the DMG, so mount the DMG to verify
          # the packaged app binary and any embedded resources.
          MOUNT_DIR="$(mktemp -d /tmp/ptkublet-dmg-XXXXXX)"
          cleanup() {
            hdiutil detach "${MOUNT_DIR}" -force >/dev/null 2>&1 || true
            rmdir "${MOUNT_DIR}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "Mounting ${DMG_PATH} at ${MOUNT_DIR}"
          hdiutil attach "${DMG_PATH}" -nobrowse -readonly -mountpoint "${MOUNT_DIR}"

          APP="$(find "${MOUNT_DIR}" -maxdepth 2 -type d -name 'PTKublet.app' | head -n 1)"
          if [[ -z "${APP}" ]]; then
            echo "PTKublet.app not found inside DMG" >&2
            ls -la "${MOUNT_DIR}" >&2 || true
            exit 1
          fi

          check_arch "${APP}/Contents/MacOS/PTKublet" "app binary (from DMG)"
          SIDECAR="$(find "${APP}/Contents" -type f -name 'pertisk-kube-backend' | head -n 1)"
          if [[ -z "${SIDECAR}" ]]; then
            echo "Bundled pertisk-kube-backend not found in ${APP}" >&2
            exit 1
          fi
          check_arch "${SIDECAR}" "backend sidecar (from DMG)"
          KTAIL="$(find "${APP}/Contents" -type f -name 'ktail' | head -n 1)"
          if [[ -n "${KTAIL}" ]]; then
            check_arch "${KTAIL}" "ktail sidecar (from DMG)"
          else
            echo "ktail sidecar not found in DMG app bundle (continuing)"
          fi

      - name: Verify DMG signatures and notarization staple
        if: env.HAS_APPLE_SIGNING == 'true'
        shell: bash
        run: |
          echo "Verifying signed DMG at ${DMG_PATH}"
          codesign --verify --deep --strict --verbose=2 "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${DMG_PATH}"

      - name: Skip signature checks for unsigned build
        if: env.HAS_APPLE_SIGNING != 'true'
        shell: bash
        run: |
          echo "Unsigned ${{ matrix.arch }} DMG at ${DMG_PATH}; skipping codesign/notarization checks."

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptkublet-dmg-${{ env.APP_VERSION }}-${{ matrix.arch }}
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-dmg
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download Intel and Apple Silicon DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: ptkublet-dmg-*
          merge-multiple: true
          path: dist

      - name: List release assets
        run: |
          ls -lh dist
          if ! compgen -G "dist/*_x64.dmg" >/dev/null; then
            echo "Missing Intel x64 DMG" >&2
            exit 1
          fi
          if ! compgen -G "dist/*_aarch64.dmg" >/dev/null; then
            echo "Missing Apple Silicon aarch64 DMG" >&2
            exit 1
          fi
          ls -lh dist/*.dmg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PTKublet ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: dist/*.dmg
          fail_on_unmatched_files: true
          body: |
            ## PTKublet ${{ github.ref_name }}

            macOS desktop builds for this release:

            - `PTKublet_*_aarch64.dmg` — Apple Silicon (M-series)
            - `PTKublet_*_x64.dmg` — Intel (cross-compiled)

            Unsigned builds require a right-click → Open the first time on macOS.
