name: Build macOS DMG

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build-dmg:
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: brew install protobuf

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            frontend/src-tauri -> frontend/src-tauri/target

      - name: Resolve app version from tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(git describe --tags --always --abbrev=7 2>/dev/null || echo "1.0.0-dev")"
          fi

          VERSION="${VERSION#v}"
          VERSION="${VERSION//-/.}"

          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved app version: ${VERSION}"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build bundled backend binary
        run: cargo build --release -p pertisk-kube-backend

      - name: Build unsigned macOS DMG
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          npm run tauri:build -- --bundles dmg --config '{"version":"${{ env.APP_VERSION }}"}'

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptkublet-dmg-${{ env.APP_VERSION }}
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error