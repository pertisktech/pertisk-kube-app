name: Build macOS DMG

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: brew install protobuf

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            frontend/src-tauri -> frontend/src-tauri/target

      - name: Resolve app version from tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(git describe --tags --always --abbrev=7 2>/dev/null || echo "1.0.0-dev")"
          fi

          VERSION="${VERSION#v}"

          # Keep display/app version as-is, but force a strict semver for tauri config.
          TAURI_VERSION="$(echo "${VERSION}" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [[ -z "${TAURI_VERSION}" ]]; then
            TAURI_VERSION="0.1.0"
          fi

          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAURI_VERSION=${TAURI_VERSION}" >> "$GITHUB_ENV"
          echo "Resolved app version: ${VERSION}"
          echo "Resolved tauri version: ${TAURI_VERSION}"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build bundled backend binary
        run: cargo build --release -p pertisk-kube-backend

      - name: Build ktail binary for bundling
        shell: bash
        run: |
          KTAIL_DIR="/tmp/pertisk-ktail"
          rm -rf "${KTAIL_DIR}"
          git clone --depth 1 https://github.com/pertisktech/pertisk-ktail.git "${KTAIL_DIR}"
          cargo build --release --manifest-path "${KTAIL_DIR}/Cargo.toml"

          if [[ -x "${KTAIL_DIR}/target/release/ktail" ]]; then
            echo "KTAIL_BINARY_PATH=${KTAIL_DIR}/target/release/ktail" >> "$GITHUB_ENV"
          elif [[ -x "${KTAIL_DIR}/target/release/pertisk-ktail" ]]; then
            echo "KTAIL_BINARY_PATH=${KTAIL_DIR}/target/release/pertisk-ktail" >> "$GITHUB_ENV"
          else
            echo "ktail binary was not produced" >&2
            exit 1
          fi

      - name: Build unsigned macOS DMG
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          KTAIL_BINARY_PATH: ${{ env.KTAIL_BINARY_PATH }}
        run: |
          npm run tauri:build -- --bundles dmg --config '{"version":"${{ env.TAURI_VERSION }}"}'

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptkublet-dmg-${{ env.APP_VERSION }}
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release with DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: frontend/src-tauri/target/release/bundle/dmg/*.dmg