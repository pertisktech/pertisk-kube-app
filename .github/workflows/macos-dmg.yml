name: Build macOS DMG

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: brew install protobuf

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            frontend/src-tauri -> frontend/src-tauri/target

      - name: Resolve app version from tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(git describe --tags --always --abbrev=7 2>/dev/null || echo "1.0.0-dev")"
          fi

          VERSION="${VERSION#v}"

          # Keep display/app version as-is, but force a strict semver for tauri config.
          TAURI_VERSION="$(echo "${VERSION}" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [[ -z "${TAURI_VERSION}" ]]; then
            TAURI_VERSION="0.1.0"
          fi

          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAURI_VERSION=${TAURI_VERSION}" >> "$GITHUB_ENV"
          echo "Resolved app version: ${VERSION}"
          echo "Resolved tauri version: ${TAURI_VERSION}"

      - name: Detect macOS signing configuration
        shell: bash
        run: |
          missing=0
          for var in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!var}" ]]; then
              echo "Missing required secret: ${var}" >&2
              missing=1
            fi
          done

          if [[ "${missing}" -eq 0 ]]; then
            echo "HAS_APPLE_SIGNING=true" >> "$GITHUB_ENV"
            echo "Apple signing/notarization secrets detected."
          else
            echo "HAS_APPLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "Apple signing/notarization secrets are incomplete."
          fi
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Fail tag release when Apple signing secrets are missing
        if: github.ref_type == 'tag' && env.HAS_APPLE_SIGNING != 'true'
        shell: bash
        run: |
          echo "Refusing to publish unsigned macOS release artifacts for tag builds." >&2
          echo "Configure APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID in repository secrets." >&2
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build bundled backend binary
        run: cargo build --release -p pertisk-kube-backend

      - name: Build ktail binary for bundling
        shell: bash
        run: |
          KTAIL_DIR="/tmp/pertisk-ktail"
          rm -rf "${KTAIL_DIR}"
          git clone --depth 1 https://github.com/pertisktech/pertisk-ktail.git "${KTAIL_DIR}"
          cargo build --release --manifest-path "${KTAIL_DIR}/Cargo.toml"

          if [[ -x "${KTAIL_DIR}/target/release/ktail" ]]; then
            echo "KTAIL_BINARY_PATH=${KTAIL_DIR}/target/release/ktail" >> "$GITHUB_ENV"
          elif [[ -x "${KTAIL_DIR}/target/release/pertisk-ktail" ]]; then
            echo "KTAIL_BINARY_PATH=${KTAIL_DIR}/target/release/pertisk-ktail" >> "$GITHUB_ENV"
          else
            echo "ktail binary was not produced" >&2
            exit 1
          fi

      - name: Build signed and notarized macOS DMG
        if: env.HAS_APPLE_SIGNING == 'true'
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          KTAIL_BINARY_PATH: ${{ env.KTAIL_BINARY_PATH }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run tauri:build -- --bundles dmg --config '{"version":"${{ env.TAURI_VERSION }}"}'

      - name: Build unsigned macOS DMG (manual runs only)
        if: env.HAS_APPLE_SIGNING != 'true' && github.event_name == 'workflow_dispatch'
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          KTAIL_BINARY_PATH: ${{ env.KTAIL_BINARY_PATH }}
        run: |
          npm run tauri:build -- --bundles dmg --config '{"version":"${{ env.TAURI_VERSION }}"}'

      - name: Verify DMG signatures and notarization staple
        if: env.HAS_APPLE_SIGNING == 'true'
        shell: bash
        run: |
          DMG_PATH="$(ls -1 frontend/src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)"
          if [[ -z "${DMG_PATH}" ]]; then
            echo "No DMG produced" >&2
            exit 1
          fi

          echo "Verifying DMG at ${DMG_PATH}"
          codesign --verify --deep --strict --verbose=2 "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${DMG_PATH}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptkublet-dmg-${{ env.APP_VERSION }}
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release with DMG
        if: github.ref_type == 'tag' && env.HAS_APPLE_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: frontend/src-tauri/target/release/bundle/dmg/*.dmg