<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2e1065" />
      <stop offset="0.5" stop-color="#4c1d95" />
      <stop offset="1" stop-color="#6d28d9" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg)" />
  <!-- Kubernetes helm wheel (7 spokes) -->
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="20" stroke="white" stroke-width="4.5" fill="none"/>
  <!-- Hub -->
  <circle cx="32" cy="32" r="5.5" fill="white"/>
  <!-- 7 spokes at 360/7 ≈ 51.43° intervals -->
  <rect x="30.75" y="15.5" width="2.5" height="11"  fill="white" transform="rotate(0,      32,32)"/>
  <rect x="30.75" y="15.5" width="2.5" height="11"  fill="white" transform="rotate(51.43,  32,32)"/>
  <rect x="30.75" y="15.5" width="2.5" height="11"  fill="white" transform="rotate(102.86, 32,32)"/>
  <rect x="30.75" y="15.5" width="2.5" height="11"  fill="white" transform="rotate(154.29, 32,32)"/>
  <rect x="30.75" y="15.5" width="2.5" height="11"  fill="white" transform="rotate(205.71, 32,32)"/>
  <rect x="30.75" y="15.5" width="2.5" height="11"  fill="white" transform="rotate(257.14, 32,32)"/>
  <rect x="30.75" y="15.5" width="2.5" height="11"  fill="white" transform="rotate(308.57, 32,32)"/>
</svg>
