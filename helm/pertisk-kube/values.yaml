# Default values for pertisk-kube unified deployment

# Override the chart name
nameOverride: ""
# Override the full name
fullnameOverride: ""

namespace:
  # Whether to create the namespace (use with --create-namespace flag)
  create: false

# Unified application configuration
app:
  name: pertisk-kube
  replicaCount: 1
  image:
    registry: harbor.tools.thaidevops.co
    repository: pertisksoft/pertisk-kube/web
    tag: "v0.0.4"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8091
    targetPort: 8091
    grpcPort: 50051
    grpcTargetPort: 50051
  env:
    rustLog: info
  auth:
    username: admin
    password: admin
    jwtSecret: "your-secret-key-change-in-production"  # Change this in production!
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  startupProbe:
    httpGet:
      path: /api/health
      port: 8091
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 12
  readinessProbe:
    httpGet:
      path: /api/readiness
      port: 8091
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /api/health
      port: 8091
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: pertisk-kube.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: pertisk-kube-tls
      hosts:
        - pertisk-kube.example.com

ingressGrpc:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
  hosts:
    - host: pertisk-kube.example.com
      paths:
        - path: /kubernetes.KubernetesWatch/
          pathType: Prefix
  tls:
    - secretName: pertisk-kube-tls
      hosts:
        - pertisk-kube.example.com

# RBAC configuration
rbac:
  create: true
  serviceAccountName: pertisk-kube-sa
  rules:
    # Core resources
    - apiGroups: [""]
      resources:
        [
          "pods",
          "pods/log",
          "services",
          "endpoints",
          "nodes",
          "namespaces",
          "events",
          "persistentvolumeclaims",
          "persistentvolumes",
          "configmaps",
          "secrets",
          "serviceaccounts",
          "limitranges",
          "resourcequotas",
        ]
      verbs: ["get", "list", "watch"]
    # Apps resources
    - apiGroups: ["apps"]
      resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      verbs: ["get", "list", "watch"]
    # Batch resources
    - apiGroups: ["batch"]
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list", "watch"]
    # Networking resources
    - apiGroups: ["networking.k8s.io"]
      resources: ["ingresses", "networkpolicies", "ingressclasses"]
      verbs: ["get", "list", "watch"]
    # Storage resources
    - apiGroups: ["storage.k8s.io"]
      resources: ["storageclasses", "volumeattachments", "csinodes", "csidrivers", "csistoragecapacities"]
      verbs: ["get", "list", "watch"]
    # RBAC Access Control resources
    - apiGroups: ["rbac.authorization.k8s.io"]
      resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
      verbs: ["get", "list", "watch"]
    # Autoscaling resources
    - apiGroups: ["autoscaling"]
      resources: ["horizontalpodautoscalers"]
      verbs: ["get", "list", "watch"]
    # Policy resources
    - apiGroups: ["policy"]
      resources: ["poddisruptionbudgets", "podsecuritypolicies"]
      verbs: ["get", "list", "watch"]
    # Metrics
    - apiGroups: ["metrics.k8s.io"]
      resources: ["pods", "nodes"]
      verbs: ["get", "list", "watch"]
