# Default values for pertisk-kube unified deployment

# Override the chart name
nameOverride: ""
# Override the full name
fullnameOverride: ""

namespace:
  # Whether to create the namespace (use with --create-namespace flag)
  create: false

# Unified application configuration
app:
  name: pertisk-kube
  replicaCount: 1
  image:
    registry: harbor.tools.thaidevops.co
    repository: pertisksoft/pertisk-kube/web
    tag: "v0.0.4"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8091
    targetPort: 8091
  env:
    rustLog: info
  auth:
    username: admin
    password: admin
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  startupProbe:
    httpGet:
      path: /api/health
      port: 8091
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 12
  readinessProbe:
    httpGet:
      path: /api/readiness
      port: 8091
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /api/health
      port: 8091
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: pertisk-kube.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: pertisk-kube-tls
      hosts:
        - pertisk-kube.example.com

# RBAC configuration
rbac:
  create: true
  serviceAccountName: pertisk-kube-sa
  rules:
    - apiGroups: [""]
      resources:
        [
          "pods",
          "services",
          "nodes",
          "namespaces",
          "events",
          "persistentvolumeclaims",
          "persistentvolumes",
        ]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["batch"]
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["metrics.k8s.io"]
      resources: ["pods"]
      verbs: ["get", "list", "watch"]
