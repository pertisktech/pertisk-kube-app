{{- if and .Values.rbac.create .Values.leaderElection.enabled .Values.leaderElection.createLease }}
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ .Values.leaderElection.leaseName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pertisk-kube.labels" . | nindent 4 }}
spec:
  holderIdentity: ""
  leaseDurationSeconds: {{ .Values.leaderElection.leaseDurationSeconds | default 30 }}
{{- end }}
